version: '3.8'

services:
  # MongoDB Database Service
  mongo:
    image: mongo:6.0
    container_name: taskmanager-mongo
    restart: always
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    networks:
      - task-network

  # Node.js/Express Backend Service
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: taskmanager-backend
    restart: always
    ports:
      - "5000:5000"
    environment:
      - PORT=5000
      - MONGO_URI=mongodb://mongo:27017/taskdb
      - JWT_SECRET=taskmanager_docker_secret_key_2026
    depends_on:
      - mongo
    networks:
      - task-network

  # React Frontend Portfolio Client
  frontend:
    build:
      context: ../portfolio
      dockerfile: Dockerfile
    container_name: taskmanager-frontend
    restart: always
    ports:
      - "5173:5173"
    depends_on:
      - backend
    networks:
      - task-network

volumes:
  mongo_data:

networks:
  task-network:
    driver: bridge
